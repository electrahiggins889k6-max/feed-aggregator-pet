    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate @ now
          command: |
            mkdir -p /tmp/zone1
            { set +o pipefail 2>/dev/null; date --date "this friday" +"%X"; true ; } > /tmp/zone1/MV
            echo "gate echo-5: $(wc -c </tmp/zone1/MV) bytes total"
      - persist_to_workspace:
          root: /tmp/zone1
          paths:
            - 'MV'
  echo-5:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/zone1
      - run:
          name: Receive handoff signal
          command: |
            cat /tmp/zone1/RMA-20772-FU
      - run:
          name: Clone upstream
          command: git clone -q --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: xzcat uploads-staging.tar.xz | tar xf -
      - run:
          command: ./seed-ingressor
